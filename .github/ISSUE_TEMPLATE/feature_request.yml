name: Feature Request
description: Suggest an idea or enhancement for romm-steam-sync
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide details about your idea and how it would benefit the community.

  - type: textarea
    id: problem-statement
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem or limitation is.
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: roadmap
    attributes:
      label: Does this relate to something already on the Roadmap?
      description: Check our [Roadmap](https://github.com/cupajoe24/romm-steam-sync/projects/1) and see if this feature is already planned, or if your request augments a planned feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or mockups about the feature request here.
